name: Deploy to GitHub Pages

on:
  push:
    branches: [build/4saisons-site, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, don't cancel in-progress runs
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Tells astro.config.mjs to build for the GitHub Pages preview
    # (site tomsoucai.github.io + base /resto-4saisons). Without it the build
    # targets production (https://resto4saisons.com, no base path).
    env:
      DEPLOY_TARGET: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build with Astro
        uses: withastro/action@v3
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
